overwrite: true
schema: "https://graph.codeday.org/"
generates:
  ./src/gql/:
    documents: "./src/**/*.{ts,tsx}"
    preset: client
    presetConfig:
      fragmentMasking:
        unmaskFunctionName: useFragment
    config:
      scalars:
        # Date/time scalars are ISO-8601 strings on the wire (parsed with
        # luxon/Date at the call site, not by codegen).
        CmsDateTime: string
        ShowYourWorkDateTime: string
        ShowcaseDateTime: string
        CalendarDateTime: string
        LabsDateTime: string
        AdvisorsDateTime: string
        ClearDateTime: string
        CmsDimension: number
        CmsQuality: number
        CmsHexColor: string
        CmsJSON: "Record<string, any>"
        CalendarJSONObject: "Record<string, any>"
        EmailJSONObject: "Record<string, any>"
        LabsJSONObject: "Record<string, any>"
        LabsJSON: "Record<string, any>"
        AdvisorsJSONObject: "Record<string, any>"
        ClearJSON: "Record<string, any>"
        ClearJSONObject: "Record<string, any>"
        CmsCircle: "Record<string, any>"
        CmsRectangle: "Record<string, any>"
        Upload: "File"
